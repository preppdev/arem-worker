# ExifTool config for the custom XMP-arem namespace.
#
# Used by pipeline/run_pipeline.py embed_classification_exif() to write
# room/interior metadata into every output JPG. Pass to exiftool as:
#
#     exiftool -config /path/to/exiftool_arem.cfg -XMP-arem:roomType=kitchen ...
#
# Namespace: https://arem.hrhomepics.com/xmp/1.0/
# Prefix:    arem
#
# Companion writes:
#   - XMP-dc:Subject + IPTC:Keywords (multi-value, e.g. ["interior", "kitchen"])
#     keep room metadata discoverable in Lightroom/Bridge/Finder without
#     needing this config file
#   - EXIF UserComment (JSON blob) — legacy compat; readable by any tool

%Image::ExifTool::UserDefined = (
    'Image::ExifTool::XMP::Main' => {
        arem => {
            SubDirectory => {
                TagTable => 'Image::ExifTool::UserDefined::arem',
            },
        },
    },
);

%Image::ExifTool::UserDefined::arem = (
    GROUPS    => { 0 => 'XMP', 1 => 'XMP-arem', 2 => 'Image' },
    NAMESPACE => { arem => 'https://arem.hrhomepics.com/xmp/1.0/' },
    WRITABLE  => 'string',
    isInterior          => { Writable => 'boolean' },
    roomType            => {},
    roomConfidence      => { Writable => 'real' },
    interiorConfidence  => { Writable => 'real' },
    classifierVersion   => {},
    classifiedAt        => {},
    stage3Variant       => {},
);

1; # ExifTool requires this for config files.
