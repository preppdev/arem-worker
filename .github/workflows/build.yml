name: Build & push container image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update RunPod template to new SHA-tagged image
        if: github.ref == 'refs/heads/main'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          RUNPOD_REGISTRY_AUTH_ID: ${{ secrets.RUNPOD_REGISTRY_AUTH_ID }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          api_key = os.environ["RUNPOD_API_KEY"]
          tpl_id  = os.environ["RUNPOD_TEMPLATE_ID"]
          reg_id  = os.environ["RUNPOD_REGISTRY_AUTH_ID"]
          image   = f"{os.environ['IMAGE_REPO']}:sha-{os.environ['GIT_SHA'][:7]}"
          print(f"Updating template {tpl_id} → {image}")

          def gql(query, variables=None):
              # RunPod GraphQL accepts the API key via query string. Some
              # GHA runner IPs return 403 on Bearer-header auth; URL-param
              # auth works consistently across all RunPod endpoints.
              payload = json.dumps({"query": query, "variables": variables or {}}).encode()
              req = urllib.request.Request(
                  f"https://api.runpod.io/graphql?api_key={api_key}",
                  data=payload, method="POST",
                  headers={"Content-Type": "application/json",
                           # Cloudflare in front of api.runpod.io blocks
                           # urllib's default UA with error 1010 (HTTP 403).
                           "User-Agent": "arem-worker-deploy/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code}: {e.read().decode('utf-8', 'replace')[:300]}")
                  raise

          # Pull all templates, find ours
          q = """query { myself { podTemplates {
              id name imageName containerDiskInGb volumeInGb volumeMountPath
              dockerArgs ports readme isServerless isPublic
              containerRegistryAuthId env { key value }
          } } }"""
          resp = gql(q)
          if "errors" in resp:
              print("LIST ERROR:", json.dumps(resp, indent=2)); raise SystemExit(1)
          tpls = resp["data"]["myself"]["podTemplates"]
          tpl = next((t for t in tpls if t["id"] == tpl_id), None)
          if tpl is None:
              print(f"template {tpl_id!r} not found in {[t['id'] for t in tpls]}")
              raise SystemExit(1)

          # Build the SaveTemplate input — all required fields populated
          fields = ["id","name","imageName","containerDiskInGb","volumeInGb",
                    "volumeMountPath","dockerArgs","ports","readme",
                    "isServerless","isPublic","containerRegistryAuthId","env"]
          input_var = {k: tpl.get(k) for k in fields}
          for s in ("volumeMountPath","dockerArgs","ports","readme"):
              if input_var.get(s) is None: input_var[s] = ""
          if input_var.get("volumeInGb") is None: input_var["volumeInGb"] = 0
          input_var["imageName"] = image
          input_var["containerRegistryAuthId"] = reg_id

          # Ensure required worker env is present on the template. The worker's
          # production dual-write (R2 tours/<job>/photos + Cloudflare Images)
          # silently no-ops when R2_OUTPUT_BUCKET is unset, which is how
          # cloud-processed shoots ended up with no productionR2Path/cfImageId.
          # R2_OUTPUT_BUCKET is a non-secret bucket name (declared here);
          # the Cloudflare creds come from GH Actions secrets (only injected
          # when present, so a missing secret never clobbers an existing
          # value). Without these the worker's production dual-write no-ops
          # (R2_OUTPUT_BUCKET) or skips cfImageId (CF creds).
          env = list(input_var.get("env") or [])
          print("template env keys (before):", sorted(e["key"] for e in env))
          by_key = {e["key"]: e for e in env}
          def ensure(k, v):
              if not v:
                  return
              if k in by_key:
                  by_key[k]["value"] = v
              else:
                  e = {"key": k, "value": v}; env.append(e); by_key[k] = e
          ensure("R2_OUTPUT_BUCKET", "arem-production-edit-jobs")
          ensure("CLOUDFLARE_API_TOKEN", os.environ.get("CLOUDFLARE_API_TOKEN", ""))
          ensure("CLOUDFLARE_ACCOUNT_ID", os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""))
          input_var["env"] = [{"key": e["key"], "value": e["value"]} for e in env]
          print("template env keys (after): ", sorted(e["key"] for e in input_var["env"]))

          m = """mutation S($input: SaveTemplateInput!) {
              saveTemplate(input: $input) { id imageName }
          }"""
          out = gql(m, {"input": input_var})
          print(json.dumps(out, indent=2))
          if "errors" in out: raise SystemExit(1)
          PY
